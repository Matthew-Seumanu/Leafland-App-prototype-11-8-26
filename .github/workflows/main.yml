name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack photos
        run: cd www && unzip -o -q img.zip && rm img.zip

      - name: Install packages
        run: npm install || npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon & splash
        run: npx -y @capacitor/assets generate --android
        continue-on-error: true

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          P=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=[0-9]*/networkTimeout=120000/' $P
          ./gradlew assembleDebug --no-daemon && exit 0
          echo "Gradle download failed - trying a mirror"
          V=$(grep -o 'gradle-[0-9.]*-' $P | head -1)
          sed -i "s#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/${V}bin.zip#" $P
          ./gradlew assembleDebug --no-daemon && exit 0
          echo "Mirror failed - using the Gradle already on the machine"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leafland-prototype-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
